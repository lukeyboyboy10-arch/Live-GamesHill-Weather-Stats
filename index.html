<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Live Weather Station</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #eaf4ff; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        h1 { color: #1d3557; margin-bottom: 5px; }
        .subtitle { color: #555; margin-bottom: 30px; font-size: 16px; }
        
        .sticker-container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Responsive iframe container */
        iframe {
            border: none;
            border-radius: 8px;
            width: 100%;
            max-width: 580px;
            height: 250px;
        }

        .view-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #1d3557;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.2s ease;
        }
        .view-btn:hover {
            background-color: #457b9d;
        }
    </style>
</head>
<body>

    <h1>🌦️ My Weather Station</h1>
    <div class="subtitle">Live feeds broadcasting from my Raddy MN6 Console</div>

    <div class="sticker-container">
        <!-- LIVE WEATHERCLOUD STICKER MOUNT -->
        <!-- INSTRUCTIONS: Change the 10-digit number inside the URL below to your real Device Code -->
        <iframe src="https://weathercloud.net"></iframe>

        <!-- Quick link to your full dashboard profile -->
        <a href="https://weathercloud.net" id="full-profile-link" target="_blank" class="view-btn">
            📊 View Full Charts & History
        </a>
    </div>

    <script>
        // CONFIGURATION: Put your 10-digit Weathercloud device number here
        // Example: '0123456789'
        var WEATHERCLOUD_DEVICE_CODE = '2266995417';

        // Automatically configures the sticker graphics and buttons on page launch
        if (WEATHERCLOUD_DEVICE_CODE !== 'YOUR_DEVICE_CODE_HERE') {
            document.querySelector('iframe').src = "https://weathercloud.net" + WEATHERCLOUD_DEVICE_CODE + "/en/metric";
            document.getElementById('full-profile-link').href = "https://app.weathercloud.net/d" + WEATHERCLOUD_DEVICE_CODE + "#current";
        }
    </script>
</body>
</html>
