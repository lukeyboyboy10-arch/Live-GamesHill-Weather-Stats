<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live GamesHill Weather Station</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: #ffffff;
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        h1 { color: #ffffff; margin-bottom: 5px; }
        .subtitle { color: #cccccc; margin-bottom: 30px; font-size: 16px; }
        
        .sticker-container {
            max-width: 900px;
            margin: auto;
            background: #2a2a2a;
            padding: 30px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        iframe {
            border: none;
            border-radius: 8px;
            width: 100%;
            max-width: 580px;
            height: 250px;
            background: transparent;
        }

        .view-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #00a8ff;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.2s ease;
        }
        .view-btn:hover {
            background-color: #0084cc;
        }
    </style>
</head>
<body>

    <h1>🌦️ Live GamesHill Weather Station</h1>
    <div class="subtitle">Live feeds broadcasting from GamesHill Stewarton</div>

    <div class="sticker-container">
        <!-- LIVE WEATHERCLOUD STICKER -->
        <iframe id="weather-widget" src="" sandbox="allow-scripts allow-same-origin"></iframe>

        <a href="#" id="full-profile-link" target="_blank" class="view-btn">
            📊 View Full Charts & History
        </a>
    </div>

    <script>
        // CONFIGURATION: Put ONLY your numbers here (Example: '7541298532')
        var WEATHERCLOUD_DEVICE_CODE = '2266995417';

        if (WEATHERCLOUD_DEVICE_CODE !== '2266995417') {
            // Re-routing to use the direct open-embed URL structure
            document.getElementById('weather-widget').src = "https://weathercloud.net" + WEATHERCLOUD_DEVICE_CODE + "/en/metric";
            document.getElementById('full-profile-link').href = "https://weathercloud.net" + WEATHERCLOUD_DEVICE_CODE;
        }
    </script>
</body>
</html>
